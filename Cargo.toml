[package]
name = "razornd-identity-cli"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1"
openidconnect = "4"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
tiny_http = "0.12"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
thiserror = "2"
url = "2"
webbrowser = "1"

[dev-dependencies]
base64 = "0.22"
serde_json = "1"
wiremock = "0.6"
