[package]
name = "razornd-identity-cli"
version = "0.1.0-snapshot"
edition = "2024"

[dependencies]
anyhow = "1"
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
dialoguer = "0.12"
keyring = "4.2"
openidconnect = "4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
thiserror = "2"
url = "2"
webbrowser = "1"

[dev-dependencies]
base64 = "0.22"
keyring-core = "1"
wiremock = "0.6"
