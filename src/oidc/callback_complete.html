        :root {
            color-scheme: light;
            font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;

            background: #f4f5f2;
            font-synthesis: none;
            text-rendering: optimizeLegibility;
            -webkit-font-smoothing: antialiased;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-width: 320px;
            min-height: 100vh;
            min-height: 100svh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 32px 20px;
        }

        main {
            width: min(100%, 480px);
            padding: 48px 44px 40px;
            text-align: center;
            background: #fff;
            border: 1px solid #e0e5df;
            border-radius: 16px;
            box-shadow: 0 18px 55px rgb(23 33 31 / 6%);
        }

        .brand {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 42px;
            color: #17211f;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: -.2px;
        }

        .brand img {
            width: 32px;
            height: 32px;
        }

        .status-icon {
            width: 68px;
            height: 68px;
            margin: 0 auto 26px;
            display: grid;
            place-items: center;
            color: #17211f;
            background: #e2f4eb;
            border: 1px solid #b8e8d5;
            border-radius: 50%;
        }

        .status-icon svg {
            width: 30px;
            height: 30px;
        }

        h1 {
            margin: 0;
            font-size: clamp(25px, 6vw, 32px);
            font-weight: 650;
            letter-spacing: -1px;
            line-height: 1.2;
        }

        p {
            margin: 14px 0 0;
            color: #7b8189;
            font-size: 15px;
            line-height: 1.7;
        }

        .hint {
            margin-top: 32px;
            padding: 14px 16px;
            color: #53615b;
            background: #f4f5f2;
            border-radius: 8px;
            font-size: 13px;
            line-height: 1.6;
        }

        @media (max-width: 480px) {
            main {
                padding: 36px 24px 30px;
                border-radius: 13px;
            }

            .brand {
                margin-bottom: 34px;
            }
        }
    </style>
